<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notepad Tracker</title>
</head>

<body>

    <h1>Notepad Tracker</h1>

    <label for="file-path">File Path:</label>

    <input
        type="text"
        id="file-path"
        placeholder="Enter file path"
    >

    <br><br>

    <textarea
        id="editor"
        rows="20"
        cols="80"
        placeholder="Start typing..."
    ></textarea>

    <script src="/script.js"></script>

</body>

</html>
